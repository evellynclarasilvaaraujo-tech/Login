<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Autenticação</title>
  <link rel="stylesheet" href="estilologin.css">
</head>
<body>

  <form class="boxLogin" id="formLogin" novalidate>
    <div class="icone-topo">
      <i class="bi bi-lock-fill"></i>
    </div>
    <h1>Bem-vindo de volta</h1>
    <p class="subtitulo">Entre com sua conta para continuar</p>

    <div class="campo">
      <label for="email">E-mail</label>
      <div class="campo-input">
        <i class="bi bi-envelope icone-campo"></i>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="username">
      </div>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="campo-input">
        <i class="bi bi-lock icone-campo"></i>
        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
        <button type="button" class="alternar-senha" id="btnAlternarSenha" aria-label="Mostrar senha">
          <span id="iconeAlternarSenha">👁️</span>
        </button>
      </div>
    </div>

    <div class="linha-termos">
      <input type="checkbox" id="termoDeUso">
      <label for="termoDeUso">Li e concordo com os termos de uso</label>
    </div>

    <button type="submit" class="btn-entrar">Entrar</button>

    <p class="rodape-login">Sistema de Autenticação</p>
  </form>

  <script src="scriptlogin.js"></script>
</body>
</html>
